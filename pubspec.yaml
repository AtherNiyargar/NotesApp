name: notes_app
description: "A simple notes app."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.3

dependencies:
  cupertino_ui: ^1.0.2
  flutter:
    sdk: flutter
  


  provider: ^6.1.5+1
  supabase_flutter: ^2.17.2

  material_ui: any
  cupertino_icons: ^1.0.9
  cupertino_lists_enhanced: ^0.1.3
  email_validator: ^3.0.0
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.6
  sqflite: ^2.4.4
  path: ^1.9.1
  webview_flutter: ^4.14.1
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  internet_connection_checker_plus: ^3.1.2
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  liquid_glass_widgets: ^1.8.1
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  image: assets/splash.png
  color: "#000000"
  fullscreen: true
  android_12:
    color: "#000000"
    image: assets/splash.png
    fullscreen: true


flutter:
  assets:
    - .env
    - assets/
#   uses-material-design: true
